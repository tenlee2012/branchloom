name: Build desktop installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: |
          APP_VERSION=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          DESKTOP_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          CLI_VERSION=$(node -p "require('fs').readFileSync('./packages/cli/native/Cargo.toml', 'utf8').match(/\[package\][\s\S]*?version\s*=\s*\"([^\"]+)\"/)[1]")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Tauri version $APP_VERSION"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$APP_VERSION" ] || \
             [ "$DESKTOP_VERSION" != "$APP_VERSION" ] || \
             [ "$CLI_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Version mismatch: root=$ROOT_VERSION desktop=$DESKTOP_VERSION cli=$CLI_VERSION tauri=$APP_VERSION"
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test:unit

      - name: Run Rust workspace tests
        run: cargo test --workspace

  create-release:
    name: Create release
    needs: test
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    outputs:
      release-id: ${{ steps.release.outputs.result }}

    steps:
      - name: Create or find release
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const releaseName = `有谱 ${tag}`;
            const releaseBody = [
              "有谱桌面端安装包。每个平台的安装包均内置匹配版本的原生 CLI 与 Codex Skill，",
              "安装桌面端后可从“AI 工具”页面离线安装、更新或修复，无需 npm 或 npx。",
              "",
              "## macOS 安装说明",
              "",
              "macOS 安装包使用 ad-hoc 签名，未经过 Apple Developer ID 签名和公证。",
              "请只从本项目官方 GitHub Release 下载并确认来源可信。将“有谱”拖入“应用程序”文件夹后，",
              "若系统提示“App 已损坏”或无法验证开发者，请打开“终端”执行：",
              "",
              "```bash",
              "xattr -dr com.apple.quarantine \"/Applications/有谱.app\"",
              "open \"/Applications/有谱.app\"",
              "```",
              "",
              "以上命令只移除“有谱”的互联网下载隔离标记，不会关闭系统的全局 Gatekeeper。",
              "仅对从本项目官方 GitHub Release 下载的安装包执行此操作。",
              "",
              "Windows 安装包目前也未进行商业代码签名，安装时可能显示安全提醒。",
            ].join("\n");
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const matchingReleases = releases.filter(
              (release) => release.tag_name === tag,
            );

            if (matchingReleases.length > 1) {
              core.setFailed(
                `Found ${matchingReleases.length} releases for ${tag}. ` +
                  "Delete the duplicate releases before rerunning this workflow.",
              );
              return "";
            }

            if (matchingReleases.length === 1) {
              const release = matchingReleases[0];
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: releaseName,
                body: releaseBody,
              });
              core.info(
                `Using existing release ${release.id} for ${tag} and updated its notes.`,
              );
              return String(release.id);
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: releaseName,
              body: releaseBody,
              draft: true,
              prerelease: true,
            });
            core.info(`Created draft release ${release.id} for ${tag}.`);
            return String(release.id);

  build:
    name: Build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cli_binary: target/x86_64-unknown-linux-gnu/release/branchloom-cli
            args: "--target x86_64-unknown-linux-gnu --bundles appimage,deb"
            cache-key: linux-x64

          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            cli_binary: target/x86_64-pc-windows-msvc/release/branchloom-cli.exe
            args: "--target x86_64-pc-windows-msvc --bundles nsis"
            cache-key: windows-x64

          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            cli_binary: target/aarch64-apple-darwin/release/branchloom-cli
            args: "--target aarch64-apple-darwin --bundles dmg"
            cache-key: macos-arm64

          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            cli_binary: target/x86_64-apple-darwin/release/branchloom-cli
            args: "--target x86_64-apple-darwin --bundles dmg"
            cache-key: macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.cache-key }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native CLI
        run: cargo build --release -p branchloom-cli --target ${{ matrix.target }}

      - name: Prepare and verify bundled CLI and Skill
        run: >-
          node packages/desktop/scripts/prepare-ai-tools.mjs
          --target ${{ matrix.target }}
          --release
          --binary ${{ matrix.cli_binary }}
          --verify

      - name: Verify macOS CLI signature
        if: startsWith(matrix.platform, 'macos-')
        run: codesign --verify --verbose=2 packages/desktop/src-tauri/resources/ai-tools/cli/branchloom-cli

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCHLOOM_AI_TOOLS_PREPARED: "1"
          BRANCHLOOM_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
          releaseAssetNamePattern: Branchloom_[version]_[platform]_[arch][setup][ext]
