[package]
name = "branchloom-cli"
version = "0.1.3"
description = "Branchloom native command-line interface"
license = "Apache-2.0"
edition = "2021"

[[bin]]
name = "branchloom-cli"
path = "src/main.rs"

[dependencies]
branchloom-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
