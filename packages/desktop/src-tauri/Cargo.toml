[package]
name = "branchloom"
version = "0.1.1"
description = "A local-first genealogy desktop application"
authors = ["Branchloom contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "branchloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
branchloom-core = { path = "../../core" }
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
